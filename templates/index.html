<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Generator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EQ%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f5fb;--surface:#fff;--ink:#16172b;--mute:#6a6d85;--line:#e4e6f2;
    --brand:#4f46e5;--brand2:#7c3aed;--brand-soft:#eef0ff;--on-brand:#fff;
    --ok:#15803d;--ok-bg:#e8f7ee;--bad:#be2d3b;--bad-bg:#fdecee;
    --shadow:0 1px 2px rgba(22,23,43,.05),0 8px 24px rgba(22,23,43,.06);
    --grad:linear-gradient(135deg,#4f46e5,#7c3aed);
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0f1020;--surface:#181a30;--ink:#eceefc;--mute:#9a9db8;--line:#292c4a;
    --brand:#8b86ff;--brand2:#b08cff;--brand-soft:#23254a;--on-brand:#0f1020;
    --ok:#5fd68d;--ok-bg:#12281d;--bad:#ff8a95;--bad-bg:#2f1a20;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --grad:linear-gradient(135deg,#8b86ff,#b08cff);
  }}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .hero{background:var(--grad);color:#fff;padding:36px 16px 84px;text-align:center}
  .hero .logo{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);font-weight:800;font-size:1.4rem;margin-bottom:10px}
  .hero h1{margin:0;font-size:clamp(1.7rem,4vw,2.3rem);letter-spacing:-.02em}
  .hero p{margin:8px auto 0;max-width:560px;opacity:.9}
  .wrap{max-width:820px;margin:-56px auto 0;padding:0 16px 96px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:16px}
  .seg button{border:0;background:transparent;color:var(--mute);padding:10px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center}
  .seg button[aria-selected=true]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .seg svg,.btn svg{width:18px;height:18px;flex:none}
  textarea{width:100%;min-height:210px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical;transition:border-color .15s,box-shadow .15s}
  textarea:focus,input.txt:focus,input[type=number]:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem;margin-top:6px}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:38px 16px;text-align:center;color:var(--mute);cursor:pointer;background:var(--bg);transition:.15s}
  .drop:hover,.drop.over,.drop:focus-visible{border-color:var(--brand);background:var(--brand-soft);outline:0}
  .drop .ic{width:42px;height:42px;margin:0 auto 8px;color:var(--brand)}
  .drop b{color:var(--ink)} .drop small{display:block;margin-top:4px}
  .badges{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .badges span{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
  .filechip{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
  .filechip .ext{width:40px;height:40px;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:.7rem;font-weight:800;text-transform:uppercase}
  .filechip .nm{flex:1;min-width:0}
  .filechip .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filechip .nm span{color:var(--mute);font-size:.85rem}
  .x{border:0;background:transparent;color:var(--mute);font-size:1.3rem;cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px}
  .x:hover{background:var(--line);color:var(--ink)}
  .opts{display:flex;flex-wrap:wrap;gap:18px 28px;margin-top:20px;align-items:flex-end}
  .opts h3{margin:0 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{position:relative}
  .chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
  .chip span{display:block;padding:8px 14px;border:1.5px solid var(--line);border-radius:99px;font-size:.9rem;font-weight:600;color:var(--mute);transition:.15s}
  .chip input:checked + span{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
  .chip input:focus-visible + span{box-shadow:0 0 0 4px var(--brand-soft)}
  .stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
  .stepper button{border:0;background:var(--bg);color:var(--ink);width:36px;height:38px;font-size:1.2rem;cursor:pointer}
  .stepper button:hover{background:var(--brand-soft)}
  .stepper input{width:48px;border:0;text-align:center;background:var(--surface);color:var(--ink);font:inherit;font-weight:700;-moz-appearance:textfield}
  .stepper input::-webkit-inner-spin-button{display:none}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
  .btn{border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:transform .1s,opacity .15s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3)}
  .btn.primary:disabled{opacity:.6;cursor:wait}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-weight:500}
  .err.show{display:block}

  /* quiz */
  .qtop{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;margin-bottom:6px}
  .qtop .row{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mute);margin-bottom:6px;font-weight:600}
  .prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s}
  .q{animation:in .35s both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .num{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:.9rem}
  .tag{margin-left:auto;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);padding:3px 10px;border-radius:99px}
  .qtext{margin:0 0 14px;font-size:1.05rem;font-weight:500}
  .qtext .blank{display:inline-block;min-width:64px;border-bottom:2.5px solid var(--brand);margin:0 3px;transform:translateY(-3px)}
  .opt{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.12s;background:var(--surface)}
  .opt:hover{border-color:var(--brand);background:var(--brand-soft)}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.8rem;color:var(--mute);flex:none}
  .opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
  .opt:has(input:checked) .k{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
  .opt:has(input:focus-visible){box-shadow:0 0 0 4px var(--brand-soft)}
  .opt.right{border-color:var(--ok)!important;background:var(--ok-bg)!important}
  .opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad)!important;background:var(--bad-bg)!important}
  .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
  .locked .opt{pointer-events:none}
  input.txt{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
  .fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:.93rem}
  .fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.no{background:var(--bad-bg);color:var(--bad)}
  .fb .src{display:block;margin-top:6px;color:var(--mute);font-style:italic}
  .hidden{display:none!important}

  .result{text-align:center;padding:28px 22px}
  .ring{--p:0;width:130px;height:130px;margin:0 auto 12px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
  .ring div{width:100px;height:100px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:1.6rem;font-weight:800}
  .result h2{margin:0 0 4px}
  .result p{margin:0 0 16px;color:var(--mute)}
  .result .actions{justify-content:center;margin-top:0}
  footer{text-align:center;color:var(--mute);font-size:.82rem;padding:8px 16px 40px}
  @media (max-width:520px){.card{padding:16px}.opts{gap:16px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="logo">Q</div>
  <h1>Quiz Generator</h1>
  <p>Turn any text, notes or document into a practice quiz in seconds. Built with classical NLP: no AI model required.</p>
</header>

<main class="wrap">
  <form id="form" class="card" novalidate>
    <div class="seg" role="tablist">
      <button type="button" role="tab" id="tab-paste" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>Paste text</button>
      <button type="button" role="tab" id="tab-file" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>Upload file</button>
    </div>

    <div id="pane-paste">
      <textarea id="text" placeholder="Paste an article, lecture notes or textbook passage. Ten or more factual sentences work best."></textarea>
      <div class="meta"><span id="wc">0 words</span><button type="button" class="x" id="sample" style="font-size:.85rem;color:var(--brand);font-weight:600">Try sample text</button></div>
    </div>

    <div id="pane-file" class="hidden">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a file">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="m9 15 3-3 3 3"/></svg>
        <b>Click to choose a file</b> or drag it here
        <small>Up to 5 MB</small>
        <div class="badges"><span>PDF</span><span>DOCX</span><span>TXT</span><span>MD</span></div>
      </div>
      <div class="filechip hidden" id="chip">
        <div class="ext" id="ext">pdf</div>
        <div class="nm"><b id="fname"></b><span id="fsize"></span></div>
        <button type="button" class="x" id="rm" aria-label="Remove file">&times;</button>
      </div>
      <input type="file" id="file" accept=".txt,.md,.docx,.pdf,application/pdf,text/plain" hidden>
    </div>

    <div class="opts">
      <div><h3>Questions</h3>
        <div class="stepper"><button type="button" id="minus" aria-label="Fewer">&minus;</button><input type="number" id="n" min="1" max="30" value="10" aria-label="Number of questions"><button type="button" id="plus" aria-label="More">+</button></div>
      </div>
      <div><h3>Types</h3>
        <div class="chips">
          <label class="chip"><input type="checkbox" name="types" value="mcq" checked><span>Multiple choice</span></label>
          <label class="chip"><input type="checkbox" name="types" value="tf" checked><span>True / False</span></label>
          <label class="chip"><input type="checkbox" name="types" value="wh" checked><span>Short answer</span></label>
          <label class="chip"><input type="checkbox" name="types" value="cloze" checked><span>Fill in the blank</span></label>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="go" type="submit"><span id="golabel">Generate quiz</span></button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </form>

  <section id="quiz" class="hidden" aria-live="polite">
    <div class="qtop">
      <div class="row"><span id="answered">0 of 0 answered</span><span id="info"></span></div>
      <div class="prog"><i id="bar"></i></div>
    </div>
    <div id="qs"></div>

    <div class="card result hidden" id="result">
      <div class="ring" id="ring"><div id="pct">0%</div></div>
      <h2 id="rtitle"></h2><p id="rsub"></p>
      <div class="actions">
        <button class="btn ghost" id="retry" type="button">Retry</button>
        <button class="btn ghost" id="regen" type="button">New questions</button>
        <button class="btn ghost" id="dl" type="button">Download .md</button>
      </div>
    </div>

    <div class="actions" id="qactions">
      <button class="btn primary" id="check" type="button">Check answers</button>
      <button class="btn ghost" id="reveal" type="button">Show answers</button>
      <button class="btn ghost" id="regen2" type="button">New questions</button>
      <button class="btn ghost" id="dl2" type="button">Download .md</button>
    </div>
  </section>
</main>
<footer>TF-IDF · TextRank · LSA · rule-based templates</footer>

<script>
const $ = s => document.querySelector(s);
const SAMPLE = `The history of computing stretches back long before the electronic computer. Charles Babbage designed the Analytical Engine in 1837, a mechanical machine that is widely regarded as the first design for a general-purpose computer. Ada Lovelace wrote the first algorithm intended for the Analytical Engine, and she is often called the first computer programmer. In 1936, Alan Turing introduced the Turing machine, an abstract model of computation that defines what an algorithm can compute. The Turing machine remains the foundation of theoretical computer science. The ENIAC was completed in 1945 at the University of Pennsylvania. It used about 18,000 vacuum tubes and weighed roughly 30 tons. Vacuum tubes were later replaced by transistors, which are smaller, faster and far more reliable. The transistor was invented at Bell Laboratories in 1947 by John Bardeen, Walter Brattain and William Shockley. Jack Kilby demonstrated the first integrated circuit in 1958. Gordon Moore observed that the number of transistors on a chip doubles roughly every two years, an observation known as Moore's Law. The World Wide Web was proposed by Tim Berners-Lee at CERN in 1989. Machine learning is a branch of artificial intelligence that allows computers to learn patterns from data.`;
const L='ABCD', LABEL={mcq:'Multiple choice',tf:'True / False',wh:'Short answer',cloze:'Fill in the blank'};
let mode='paste', quiz=[], seedBump=0, locked=false, srcName='';

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bytes = b => b > 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB';

/* ---------- input ---------- */
function setMode(m){ mode=m; for(const k of ['paste','file']){ $('#tab-'+k).setAttribute('aria-selected',k===m); $('#pane-'+k).classList.toggle('hidden',k!==m);} }
$('#tab-paste').onclick=()=>setMode('paste'); $('#tab-file').onclick=()=>setMode('file');
$('#text').addEventListener('input',()=>{ const w=$('#text').value.trim().split(/\s+/).filter(Boolean).length; $('#wc').textContent=w+' word'+(w===1?'':'s'); });
$('#sample').onclick=()=>{ $('#text').value=SAMPLE; $('#text').dispatchEvent(new Event('input')); };

function showFile(f){
  if(!f){ $('#file').value=''; $('#chip').classList.add('hidden'); $('#drop').classList.remove('hidden'); return; }
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(!['pdf','docx','txt','md'].includes(ext)){ showErr('Unsupported file type. Use PDF, DOCX, TXT or MD.'); return showFile(null); }
  if(f.size>5*1048576){ showErr('File is larger than 5 MB.'); return showFile(null); }
  $('#err').classList.remove('show');
  $('#ext').textContent=ext; $('#fname').textContent=f.name; $('#fsize').textContent=bytes(f.size);
  $('#chip').classList.remove('hidden'); $('#drop').classList.add('hidden');
}
$('#drop').onclick=()=>$('#file').click();
$('#drop').onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('#file').click(); } };
$('#file').onchange=e=>showFile(e.target.files[0]);
$('#rm').onclick=()=>showFile(null);
['dragenter','dragover'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('over');}));
['dragleave','drop'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('over');}));
$('#drop').addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f){ const dt=new DataTransfer(); dt.items.add(f); $('#file').files=dt.files; showFile(f);} });

const clampN=v=>Math.max(1,Math.min(30,v||10));
$('#minus').onclick=()=>$('#n').value=clampN(+$('#n').value-1);
$('#plus').onclick=()=>$('#n').value=clampN(+$('#n').value+1);
$('#n').onchange=()=>$('#n').value=clampN(+$('#n').value);

function showErr(m){ const e=$('#err'); e.textContent=m; e.classList.add('show'); }

/* ---------- generate ---------- */
async function generate(){
  $('#err').classList.remove('show');
  const fd=new FormData(); const f=$('#file').files[0];
  if(mode==='file'){ if(!f) return showErr('Choose a file to upload first.'); fd.append('file',f); srcName=f.name; }
  else { if(!$('#text').value.trim()) return showErr('Paste some text first.'); fd.append('text',$('#text').value); srcName='pasted text'; }
  fd.append('n',$('#n').value);
  const types=[...document.querySelectorAll('input[name=types]:checked')].map(c=>c.value);
  if(!types.length) return showErr('Pick at least one question type.');
  types.forEach(t=>fd.append('types',t));
  if(seedBump) fd.append('seed',42+seedBump);
  const go=$('#go'); go.disabled=true; go.innerHTML='<span class="spin"></span> Generating…';
  try{
    const r=await fetch('/api/generate',{method:'POST',body:fd}); const j=await r.json();
    if(!r.ok) throw new Error(j.error||'Something went wrong.');
    quiz=j.questions; $('#info').textContent=`${quiz.length} questions · ${j.sentences} sentences read`;
    render(); $('#quiz').classList.remove('hidden');
    $('#quiz').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){ showErr(e.message); }
  finally{ go.disabled=false; go.innerHTML='<span id="golabel">Generate quiz</span>'; }
}
$('#form').onsubmit=e=>{ e.preventDefault(); seedBump=0; generate(); };
const regen=()=>{ seedBump++; generate(); };
$('#regen').onclick=regen; $('#regen2').onclick=regen;

/* ---------- render ---------- */
function stem(t){ return esc(t).replace(/_{5,}/g,'<span class="blank"></span>'); }
function render(){
  locked=false; $('#result').classList.add('hidden'); $('#qactions').classList.remove('hidden');
  $('#qs').innerHTML=quiz.map((q,i)=>{
    let body='';
    if(q.qtype==='mcq') body=q.options.map((o,j)=>`<label class="opt" data-j="${j}"><input type="radio" name="q${i}" value="${j}"><span class="k">${L[j]}</span><span>${esc(o)}</span></label>`).join('');
    else if(q.qtype==='tf') body=['True','False'].map(o=>`<label class="opt" data-v="${o}"><input type="radio" name="q${i}" value="${o}"><span class="k">${o[0]}</span><span>${o}</span></label>`).join('');
    else body=`<input class="txt" name="q${i}" placeholder="Type your answer" autocomplete="off">`;
    return `<div class="card q" id="c${i}" style="animation-delay:${Math.min(i,8)*40}ms"><div class="qhead"><span class="num">${i+1}</span><span class="tag">${LABEL[q.qtype]}</span></div><p class="qtext">${stem(q.question)}</p>${body}<div class="fb hidden" id="f${i}"></div></div>`;
  }).join('');
  progress();
}
$('#qs').addEventListener('input',progress);
function isAnswered(i){ const c=$('#c'+i); const t=c.querySelector('input.txt'); return t? t.value.trim()!=='' : !!c.querySelector('input:checked'); }
function progress(){ const a=quiz.filter((_,i)=>isAnswered(i)).length; $('#answered').textContent=`${a} of ${quiz.length} answered`; $('#bar').style.width=(quiz.length?a/quiz.length*100:0)+'%'; }

/* ---------- grading ---------- */
const norm=s=>s.toLowerCase().replace(/^(the|a|an)\s+/,'').replace(/[^\w\s%.-]/g,'').trim();
function lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}
const similar=(a,b)=>{a=norm(a);b=norm(b);return !!a&&1-lev(a,b)/Math.max(a.length,b.length)>=.85;};

function grade(i,reveal){
  const q=quiz[i], card=$('#c'+i), fb=$('#f'+i); let given=null, ok=false;
  if(q.qtype==='mcq'){
    const s=card.querySelector('input:checked'); given=s?+s.value:null; const right=L.indexOf(q.answer_letter); ok=given===right;
    card.querySelectorAll('.opt').forEach(l=>{const j=+l.dataset.j; l.classList.toggle('right',j===right); l.classList.toggle('wrong',j===given&&!ok);});
  } else if(q.qtype==='tf'){
    const s=card.querySelector('input:checked'); given=s?s.value:null; ok=given===q.answer;
    card.querySelectorAll('.opt').forEach(l=>{const v=l.dataset.v; l.classList.toggle('right',v===q.answer); l.classList.toggle('wrong',v===given&&!ok);});
  } else { given=card.querySelector('input.txt').value.trim(); ok=similar(given,q.answer); }
  const skipped=given===null||given==='';
  const ans=q.qtype==='mcq'?`${q.answer_letter}) ${q.answer}`:q.answer;
  fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=`${ok?'✓ Correct. ':skipped?'Unanswered. ':'✗ Not quite. '}Answer: <b>${esc(ans)}</b><span class="src">“${esc(q.source)}”</span>`;
  card.classList.add('locked'); return ok;
}
function finish(){
  const s=quiz.reduce((a,_,i)=>a+(grade(i)?1:0),0), p=Math.round(s/quiz.length*100); locked=true;
  $('#ring').style.setProperty('--p',p); $('#pct').textContent=p+'%';
  $('#rtitle').textContent=p>=90?'Excellent!':p>=70?'Nice work':p>=50?'Getting there':'Keep practising';
  $('#rsub').textContent=`You got ${s} of ${quiz.length} correct on ${srcName}.`;
  $('#result').classList.remove('hidden'); $('#qactions').classList.add('hidden');
  $('#result').scrollIntoView({behavior:'smooth',block:'center'});
}
$('#check').onclick=finish;
$('#reveal').onclick=()=>quiz.forEach((_,i)=>grade(i,true));
$('#retry').onclick=()=>{ render(); window.scrollTo({top:$('#quiz').offsetTop-10,behavior:'smooth'}); };

function download(){
  let md='# Generated Quiz\n\n';
  quiz.forEach((q,i)=>{ md+=`**Q${i+1}.** ${q.question}\n`; if(q.options) q.options.forEach((o,j)=>md+=`   - ${L[j]}) ${o}\n`); md+='\n'; });
  md+='---\n\n## Answer key\n\n'; quiz.forEach((q,i)=>md+=`${i+1}. ${q.answer_letter?q.answer_letter+') ':''}${q.answer}\n`);
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'})); a.download='quiz.md'; a.click();
}
$('#dl').onclick=download; $('#dl2').onclick=download;
</script>
